<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6వ తరగతి సోషల్ – 3 | TLM FOR ALL</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a5a;--paper:#fffaf0;--sun:#ffc93c;--coral:#ff6b57;--leaf:#1f9d63;--sky:#3b82f6;--card:#fff;--line:#e6dcc3;--muted:#5b6385;--bad:#d93f3f}
@media (prefers-color-scheme:dark){:root{--ink:#f1f3ff;--paper:#141830;--card:#1d2342;--line:#323a66;--muted:#aab2dd}}
*{box-sizing:border-box}html,body{margin:0}html{font-size:clamp(16px,.9vw + 8px,26px);-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans Telugu','Nirmala UI','Gautami','Mandali','Noto Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
.wrap{max-width:min(1100px,96vw);margin:0 auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top a{color:var(--ink);font-weight:600;text-decoration:none}
.lang button{border:2px solid var(--ink);background:transparent;color:var(--ink);font:inherit;font-weight:600;padding:3px 12px;cursor:pointer}
.lang button:first-child{border-radius:999px 0 0 999px}.lang button:last-child{border-radius:0 999px 999px 0;border-left:0}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.hero{background:var(--sun);color:#1f2a5a;border-radius:22px;padding:18px;margin:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.hero h1{margin:0;font-size:clamp(1.3rem,4.5vw,1.9rem);line-height:1.3}.hero p{margin:4px 0 0}
.score{background:#1f2a5a;color:#fff;border-radius:16px;padding:8px 14px;text-align:center;font-weight:800;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
.tab{flex:none;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--coral);color:#fff;border-color:var(--coral)}
.panel{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.panel h2{margin:0 0 4px;font-size:1.2rem}.hint{margin:0 0 12px;color:var(--muted)}
svg{max-width:100%;height:auto}svg.fig{width:100%;max-width:640px}button,select{touch-action:manipulation}.opt{min-height:52px}
.fig{display:block;margin:8px auto;background:#eaf5dc;border-radius:14px}
.q{font-weight:800;font-size:1.1rem;margin:12px 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:600;cursor:pointer;min-height:48px}
.opt.ok{background:var(--leaf);color:#fff;border-color:var(--leaf)}.opt.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.next,.again{margin-top:12px;border:0;background:var(--ink);color:var(--paper);border-radius:12px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer}
.fb{margin-top:10px;font-weight:600}.prog{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.prog i{display:block;height:100%;background:var(--leaf)}
.sym{display:flex;justify-content:center;font-size:2.4rem;min-height:56px;align-items:center}
input[type=range]{width:100%;accent-color:var(--coral)}
.big{font-size:1.3rem;font-weight:800;text-align:center;margin:6px 0}
.task{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.task button{flex:none;border:2px solid var(--leaf);background:transparent;color:var(--leaf);border-radius:10px;font:inherit;font-weight:800;padding:4px 10px;cursor:pointer}
.task button[aria-pressed=true]{background:var(--leaf);color:#fff}
.task ol{margin:4px 0 0;padding-left:20px}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

#tm path{cursor:pointer;transition:opacity .2s,fill .2s}
#tm.dim path:not(.on){opacity:.3}
#tm .hA{stroke:#ff7a00;stroke-width:18}#tm .hB{stroke:#0057ff;stroke-width:18}
#tm .found{stroke:#1f9d63;stroke-width:12}
.shake{animation:shake .6s}.redflash{box-shadow:0 0 0 10px #ff2d2d;border-radius:14px}
@keyframes shake{10%,90%{transform:translateX(-6px)}20%,80%{transform:translateX(10px)}30%,50%,70%{transform:translateX(-16px)}40%,60%{transform:translateX(16px)}}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.chipbox{min-height:80px;display:flex;justify-content:center;align-items:center}
.chip2{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--sun);color:#1f2a5a;font-weight:800;font-size:1.4rem;padding:12px 26px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.2);z-index:50;text-align:center}
.chip2.drag{cursor:grabbing;transform:scale(1.1)}

.fxl{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden}
.fxp{position:absolute;top:-50px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(420deg)}}
.fxe{position:absolute;left:50%;top:36%;text-align:center;transform:translate(-50%,-50%);animation:pop2 1.3s ease-out forwards}
.fxe .em{font-size:5.5rem;line-height:1.1}.fxe .tx{font-weight:800;font-size:1.7rem;color:#1f9d63;text-shadow:0 2px 0 #fff,0 0 8px #fff}
.fxe .xx{font-size:6.5rem;line-height:1;color:#e11d1d;font-weight:900;text-shadow:0 3px 0 #fff}
.fxe.bad{animation:shake2 .7s,fade2 1.3s forwards}.fxe.bad .tx{color:#d93f3f}
@keyframes pop2{0%{transform:translate(-50%,-50%) scale(0)}25%{transform:translate(-50%,-50%) scale(1.25)}50%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-75%) scale(1)}}
@keyframes shake2{10%,90%{transform:translate(calc(-50% - 6px),-50%)}20%,80%{transform:translate(calc(-50% + 12px),-50%)}30%,50%,70%{transform:translate(calc(-50% - 18px),-50%)}40%,60%{transform:translate(calc(-50% + 18px),-50%)}0%,100%{transform:translate(-50%,-50%)}}
@keyframes fade2{0%,70%{opacity:1}100%{opacity:0}}
#snd{border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;font:inherit;padding:3px 12px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.fxp{display:none}}

.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0}
.tile{touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:center;min-width:76px;box-shadow:0 3px 0 rgba(0,0,0,.12);color:var(--ink)}
.tile.sel{border-color:var(--coral);border-width:4px}.tile .ti{display:block;font-size:2rem;line-height:1.25}.tile small{display:block;font-weight:700;font-size:.8rem}.tile .ti svg{max-width:64px;height:auto}
.tile.ghost{opacity:.95;background:var(--sun);color:#1f2a5a}
.field{display:grid;grid-template-columns:1fr 2.2fr 1fr;grid-template-rows:auto minmax(120px,2fr) auto;gap:6px;max-width:600px;margin:10px auto;padding:8px;background:#fffdf3;border-radius:14px;border:2px solid var(--line);color:#1f2a5a}
.field.one{display:block;padding:8px}
.field [data-z="n"]{grid-column:1/4;grid-row:1}.field [data-z="s"]{grid-column:1/4;grid-row:3}.field [data-z="w"]{grid-column:1;grid-row:2}.field [data-z="c"]{grid-column:2;grid-row:2}.field [data-z="e"]{grid-column:3;grid-row:2}
.field [data-z]{border:2px dashed #cdbf9a;border-radius:10px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;position:relative;padding:18px 4px 6px;min-height:64px;cursor:pointer}
.field .zbig{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:1.2rem;padding:10px}
.zl{position:absolute;top:2px;left:6px;font-size:.8rem;font-weight:800;color:#c0392b}
.pl{font-size:1.7rem;line-height:1}.pl svg{width:46px;height:23px}
.field [data-z="n"].has-wall{border-top:10px solid #6d4c41}.field [data-z="s"].has-wall{border-bottom:10px solid #6d4c41}.field [data-z="e"].has-wall{border-right:10px solid #6d4c41}.field [data-z="w"].has-wall{border-left:10px solid #6d4c41}
#tm .blink{animation:blink .5s 4;stroke:#ff7a00;stroke-width:22}#tm .shown{stroke:#ff9800;stroke-width:12}
@keyframes blink{50%{opacity:.2}}
.field.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));grid-template-rows:none}
.field.cols [data-z]{padding-top:8px}
.field.cols .pl{margin-top:4px}
.tile small{max-width:120px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a href="./index.html" id="back"></a>
<div style="display:flex;gap:8px"><button id="snd" aria-label="sound">🔊</button><div class="lang" role="group" aria-label="Language"><button data-l="te">తెలుగు</button><button data-l="en">English</button></div></div></div>
<header class="hero"><div><h1 id="ttl"></h1><p id="sub"></p></div><div class="score" aria-live="polite"><span id="stars">0</span> ⭐</div></header>
<nav class="tabs" id="tabs" role="tablist"></nav>
<section class="panel" id="panel"></section>
</div>
<script>
const $=s=>document.querySelector(s);
let lang='te',done={};
try{lang=localStorage.getItem('tlm-lang')||'te';done=JSON.parse(localStorage.getItem('tlm-ch3')||'{}')}catch(e){}
const L=x=>x==null?'':(typeof x==='object'?x[lang]:x);
const save=()=>{try{localStorage.setItem('tlm-ch3',JSON.stringify(done));localStorage.setItem('tlm-lang',lang)}catch(e){}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const UI={
back:{te:'← వెనక్కి',en:'← Back'},
ttl:{te:'1. పటాల అధ్యయనం–తయారీ',en:'1. Reading and Making Maps'},
sub:{te:'6వ తరగతి సోషల్: ఆడు, చేసి చూడు, ⭐ సంపాదించు',en:'Class 6 Social: play, do, earn ⭐'},
next:{te:'తర్వాత ▶',en:'Next ▶'},again:{te:'మళ్లీ ఆడు 🔄',en:'Play again 🔄'},
good:{te:'సరైనది! 🎉',en:'Correct! 🎉'},bad:{te:'కాదు. సరైన జవాబు గుర్తించాం.',en:'Not quite. The right answer is marked.'},
sc:{te:'మీ స్కోరు',en:'Your score'},got:{te:'⭐ వచ్చింది!',en:'⭐ earned!'},tryagain:{te:'80% వస్తే ⭐ వస్తుంది. మళ్లీ ప్రయత్నించు!',en:'Score 80% to earn a ⭐. Try again!'}};

/* feedback: flowers, emoji, sound */
let snd=true;try{snd=localStorage.getItem('tlm-snd')!=='0'}catch(e){}
let AC;const tone=(f,t,d,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)};
function beep(ok){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime;if(ok)[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.09,.28));else{tone(190,t,.2,'sawtooth',.12);tone(140,t+.17,.35,'sawtooth',.12)}}catch(e){}}
const PRAISE=['Very good!','Excellent!','Super!','Well done!','Great job!'];
function fb(ok){
  beep(ok);const l=document.createElement('div');l.className='fxl';let h='';
  if(ok){const pr=PRAISE[Math.random()*PRAISE.length|0],E=['🌸','🌼','🌺','🌷','🌻','⭐','🎉'];
    for(let k=0;k<30;k++)h+=`<span class="fxp" style="left:${Math.random()*96}vw;font-size:${1.4+Math.random()*1.4}rem;animation-delay:${Math.random()*.6}s;animation-duration:${1.6+Math.random()*1.2}s">${E[k%E.length]}</span>`;
    h+=`<div class="fxe"><div class="em">😄</div><div class="tx">${pr}<br>${L({te:'వెరీ గుడ్!',en:'Correct!'})}</div></div>`;
    if(snd&&window.speechSynthesis)try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(pr);u.lang='en-IN';speechSynthesis.speak(u)}catch(e){}
  }else h=`<div class="fxe bad"><div class="xx">✖</div><div class="em">😠</div><div class="tx">${L({te:'తప్పు! మళ్లీ ప్రయత్నించు',en:'Oops! Try again'})}</div></div>`;
  l.innerHTML=h;document.body.appendChild(l);setTimeout(()=>l.remove(),2600);
}
function shakePanel(){const pn=$('#panel');pn.classList.remove('shake');void pn.offsetWidth;pn.classList.add('shake','redflash');setTimeout(()=>pn.classList.remove('redflash'),700)}
/* quiz engine */
function quiz(items,key){
  let i=0,s=0;const box=$('#qbox');
  const show=()=>{
    if(i>=items.length){
      const win=s>=Math.ceil(items.length*.8);if(win){done[key]=true;save();stars()}
      box.innerHTML=`<div class="big">${L(UI.sc)}: ${s}/${items.length}</div><p class="big">${win?L(UI.got):L(UI.tryagain)}</p><div style="text-align:center"><button class="again">${L(UI.again)}</button></div>`;
      box.querySelector('.again').onclick=()=>{i=0;s=0;show()};return}
    const it=items[i],ord=shuffle(it.o.map((_,k)=>k));
    box.innerHTML=`<div class="prog"><i style="width:${i/items.length*100}%"></i></div>${it.fig?`<div class="sym">${it.fig}</div>`:''}<div class="q">${L(it.q)}</div><div class="opts">${ord.map(k=>`<button class="opt" data-k="${k}">${L(it.o[k])}</button>`).join('')}</div><div class="fb"></div>`;
    if(it.on)it.on();let locked=false;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;const ok=+b.dataset.k===it.a;if(ok)s++;
      b.classList.add(ok?'ok':'no');fb(ok);if(!ok)shakePanel();
      box.querySelectorAll('.opt').forEach(x=>{if(+x.dataset.k===it.a)x.classList.add('ok')});
      box.querySelector('.fb').innerHTML=(ok?L(UI.good):L(UI.bad))+(it.e?'<br>'+L(it.e):'')+'<br><button class="next">'+L(UI.next)+'</button>';
      box.querySelector('.next').onclick=()=>{i++;show()};
    });
  };
  show();
}

/* Directions */
function bindDrag(root,drop){
  let sel=null,ghost=null,st=null;
  const clr=()=>root.querySelectorAll('[data-t]').forEach(t=>t.classList.remove('sel'));
  root.querySelectorAll('[data-t]').forEach(t=>{
    t.onpointerdown=e=>{e.preventDefault();t.setPointerCapture(e.pointerId);st={x:e.clientX,y:e.clientY,mv:false};
      ghost=t.cloneNode(true);ghost.className='tile ghost';ghost.style.cssText='position:fixed;pointer-events:none;z-index:9998;display:none;transform:translate(-50%,-115%) scale(1.15)'};
    t.onpointermove=e=>{if(!st)return;if(Math.hypot(e.clientX-st.x,e.clientY-st.y)>8)st.mv=true;
      if(st.mv){if(!ghost.parentNode)document.body.appendChild(ghost);ghost.style.display='';ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'}};
    t.onpointerup=e=>{if(!st)return;const mv=st.mv;st=null;if(ghost){ghost.remove();ghost=null}
      if(!mv){clr();sel=t.dataset.t;t.classList.add('sel');return}
      const el=document.elementFromPoint(e.clientX,e.clientY),z=el&&el.closest&&el.closest('[data-z]');
      if(z){sel=null;clr();drop(t.dataset.t,z.dataset.z)}};
    t.onpointercancel=()=>{st=null;if(ghost){ghost.remove();ghost=null}};
  });
  const fld=root.querySelector('.field');if(fld)fld.addEventListener('click',e=>{const z=e.target.closest('[data-z]');if(z&&sel){const s=sel;sel=null;clr();drop(s,z.dataset.z)}});
}
const dropHTML=(ic,ti,hint,cls)=>`<h2>${ic} ${L(ti)}</h2><p class="hint">${L(hint)}</p><div class="tray" id="tray"></div><div class="field ${cls||''}" id="field"></div><div class="prog"><i id="gp" style="width:0"></i></div><div class="q" id="gq"></div><div class="fb" id="gf"></div>`;
function dropGame(o){
  let i=0,mis=0,lock=false;const f=$('#field'),gq=$('#gq'),gf=$('#gf'),pr=$('#gp');
  $('#tray').innerHTML=o.tiles.map(t=>`<div class="tile" data-t="${t.id}"><span class="ti">${t.ic}</span><small>${L(t.n)}</small></div>`).join('');
  f.innerHTML=o.zones;
  const ask=()=>{lock=false;if(o.reset)o.reset(f);if(i>=o.qs.length){fin();return}pr.style.width=(i/o.qs.length*100)+'%';gq.innerHTML=L(o.qs[i].q)+' <small>('+(i+1)+'/'+o.qs.length+')</small>';gf.textContent=''};
  const fin=()=>{done[o.key]=true;save();stars();pr.style.width='100%';gq.innerHTML='🎉 '+L({te:'అన్నీ పూర్తి చేశావు! ⭐',en:'All done! ⭐'});
    gf.innerHTML=L({te:'తప్పులు',en:'Mistakes'})+': '+mis+(o.final?'<br>'+o.final():'')+'<br><button class="again" id="ra">'+L(UI.again)+'</button>';$('#ra').onclick=render;fb(true)};
  bindDrag($('#panel'),(t,z)=>{
    const q=o.qs[i];if(!q||lock)return;
    if(o.check(q,t,z)){lock=true;o.place(t,z,f,q);fb(true);i++;setTimeout(ask,o.wait||900)}
    else{mis++;fb(false);f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake','redflash');setTimeout(()=>f.classList.remove('redflash'),700);gf.textContent='❌ '+L({te:'మళ్లీ ప్రయత్నించు!',en:'Try again!'})}
  });
  ask();
}
/* ===== shared helpers (bilingual: 'తెలుగు|English') ===== */
const T=s=>{const p=s.split('|');return {te:p[0],en:p.length>1?p[1]:p[0]}};
const TL=a=>a.split(';').map(T);
const QI=(q,o,a,e)=>({q:T(q),o:TL(o),a,e:e?T(e):null});
const H=(ic,ti,h)=>`<h2>${ic} ${L(T(ti))}</h2><p class="hint">${L(T(h))}</p>`;
const SUB=t=>`<h3 style="margin:18px 0 6px">${L(T(t))}</h3>`;
const DH=(ic,ti,h,c)=>dropHTML(ic,T(ti),T(h),c);
const QB='<div id="qbox"></div>';
const stars=()=>{$('#stars').textContent=Object.values(done).filter(Boolean).length};
/* pick: drag the right answer tile into the middle box */
function pickInit(key,tiles,qs){
  const tl=tiles.map(x=>({id:x[0],ic:x[1],n:T(x[2])}));
  const ph=()=>`<div class="zbig" data-z="mid">⬇️ ${L({te:'ఇక్కడ వదులు',en:'Drop here'})}</div>`;
  dropGame({key,qs:shuffle(qs).map(x=>({a:x[0],q:T(x[1])})),tiles:tl,zones:ph(),check:(q,t)=>q.a===t,wait:1200,
    place:(t,z,f)=>{const m=tl.find(x=>x.id===t);f.querySelector('.zbig').innerHTML=`<span style="font-size:3rem">${m.ic}</span><br><b>✅ ${L(m.n)}</b>`},reset:f=>{f.innerHTML=ph()}});
}
const PICKH=(ic,ti,h)=>DH(ic,ti,h||'ప్రశ్న చదివి సరైన జవాబును మధ్య పెట్టెలోకి లాగి వదులు (లేదా జవాబును నొక్కి, పెట్టెను నొక్కు).|Read the clue. Drag the right answer into the middle box (or tap the answer, then tap the box).','one');
/* sort: drag every card into the right box */
function sortInit(key,items,zones){
  const it=items.map(x=>({id:x[0],ic:x[1],n:T(x[2]),z:x[3]}));
  const zh=zones.map(z=>`<div data-z="${z[0]}" class="zbig" style="min-height:96px"><span style="font-size:2rem">${z[1]}</span><span>${L(T(z[2]))}</span><div class="pl" id="pl-${z[0]}"></div></div>`).join('');
  dropGame({key,qs:it.map(()=>({q:{te:'అన్ని కార్డులను సరైన పెట్టెలో వేయి',en:'Put every card in the right box'}})),tiles:shuffle(it),zones:zh,wait:250,
    check:(q,t,z)=>it.find(x=>x.id===t).z===z,

do:[()=>doTab(['👀 పాఠంలోని కొండలు, మైదానం, పీఠభూమి చిత్రాలు చూడు. మీ ప్రాంతం ఏ దానిలా ఉందో చెప్పు.|👀 Look at the pictures of hills, plain and plateau. Which one is like your region?','🗺️ తెలంగాణ పటంలో హైదరాబాద్, వరంగల్, కరీంనగర్, నల్గొండ ఎగువ లేదా దిగువ పీఠభూమిలో ఏ దానిలో ఉన్నాయో గుర్తించు.|🗺️ On the Telangana map find which towns are on the upper and which on the lower plateau.','🔎 భారతదేశంలోని మరికొన్ని డెల్టాల పేర్లు తెలుసుకో.|🔎 Find the names of some other deltas in India.','🏞️ కృష్ణా, గోదావరి నదుల్లో కలిసే కనీసం రెండు ఉపనదుల పేర్లు తెలుసుకో.|🏞️ Find at least two tributaries that join the Krishna and Godavari.','🏗️ గోదావరి నదిపై ఉన్న ఒక పెద్ద ఆనకట్ట ఎక్కడుందో తెలుసుకో. మెదక్ జిల్లాలో పెద్ద ఆనకట్ట ఎందుకు కట్టలేరో ఆలోచించు.|🏗️ Find where a large dam on the Godavari is. Think why a large dam cannot be built in Medak district.','🌧️ మీ ప్రాంతంలో జూన్–అక్టోబర్‌లో వర్షం పడుతుందా? సరిపోతుందా? కృష్ణా డెల్టాతో పోల్చు.|🌧️ Does it rain in your area from June to October? Is it enough? Compare with the Krishna delta.','⛏️ మీ ఊరిలో బోరుబావి ఎంత లోతు? ఏ మట్టి పొరలు దాటి నీరు వస్తుంది? పొలాలకు నీరు ఎలా ఇస్తారు? అడిగి తెలుసుకో.|⛏️ How deep is a borewell in your village? Which layers does it pass? How is land irrigated? Ask and find out.','🌊 గతంలో వచ్చిన పెద్ద వరదలు, వాటి ఫలితాల గురించి పెద్దలను అడుగు. వరద నష్టాన్ని ఎలా తగ్గించగలమో చర్చించు.|🌊 Ask elders about big floods in the past and what happened. Discuss how damage from floods and cyclones can be reduced.','🏠 పాఠంలోని ఇళ్ల ఫొటోలు చూసి పైకప్పులు, గోడలు, ప్రహరీ గోడల పోలికలు, తేడాలు చెప్పు.|🏠 Look at the house photos and tell the similarities and differences in roofs, walls and boundary walls.','🎨 భారతదేశం/తెలంగాణ పటంలో మైదానాలు ఆకుపచ్చ, పీఠభూములు పసుపు, పర్వతాలు ముదురు ఊదా లేదా గోధుమ రంగులో వేయి.|🎨 Colour a map: plains green, plateaus yellow, mountains dark brown.','🏖️ ట్రేలో ఇసుక, బంకమట్టి పోసి ఒక కొనలో నీరు పోయి చిన్న డెల్టా నమూనా చేసి చూడు.|🏖️ Put sand and clay in a tray, pour water from one end and watch a small delta model form.']),doInit],
key:[keyHTML,keyInit]};
function render(){
  document.documentElement.lang=lang;$('#snd').textContent=snd?'🔊':'🔇';
  $('#back').textContent=L(UI.back);$('#ttl').textContent=L(UI.ttl);$('#sub').textContent=L(UI.sub);
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang));
  $('#tabs').innerHTML=TABS.map(t=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${t[0]===tab}">${t[1]} ${L(T(t[2]))}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
  const v=V[tab];$('#panel').innerHTML=v[0]();if(v[1])v[1]();stars();
}
$('#snd').onclick=()=>{snd=!snd;try{localStorage.setItem('tlm-snd',snd?'1':'0')}catch(e){}render();if(snd)beep(true)};
$('#back').onclick=e=>{if(history.length>1){e.preventDefault();history.back()}};
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.l;save();render()});
if(window.top!==window.self)$('#back').style.display='none';
render();
</script>
<script src="tlm-bar.js"></script>
