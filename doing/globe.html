<!doctype html><html lang="te"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>భూగోళం – Learning with Doing</title>
<style>
:root{--sea:#0b2a5b;--sun:#ffd23f;--leaf:#2bb673;--coral:#ff6b57;--paper:#fff8e7;--ink:#14213d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 "Noto Sans Telugu","Nirmala UI",system-ui,sans-serif}
header{background:var(--sea);color:#fff;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header h1{font-size:19px;margin:0;flex:1 1 100%}
.pill{background:#ffffff26;color:#fff;border:0;border-radius:20px;padding:7px 13px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.pill.earth{background:var(--sun);color:var(--sea);font-weight:700}
#sc{font-weight:700;color:var(--sun);margin-left:auto}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:3px solid var(--sun)}
nav button{flex:0 0 auto;border:2px solid var(--sea);background:#fff;color:var(--sea);border-radius:14px;padding:8px 12px;font:inherit;font-size:14px;font-weight:700}
nav button.on{background:var(--sea);color:#fff}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border-radius:16px;padding:16px;border:2px solid #e3dcc6}
h2{margin:0 0 6px;font-size:18px}
p{margin:4px 0 8px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid #cfd6e6;border-radius:12px;background:#fff;font:inherit;color:inherit}
.opt.good{background:#d8f5e6;border-color:var(--leaf)}
.opt.bad{background:#ffe1dc;border-color:var(--coral)}
.opt.sel{background:#fff3b8;border-color:var(--sun)}
.go{background:var(--sea);color:#fff;border:0;border-radius:12px;padding:11px 20px;font:inherit;font-weight:700;margin-top:10px}
.msg{min-height:24px;font-weight:700;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.task{background:var(--sun);color:var(--sea);font-weight:800;padding:10px;border-radius:12px;font-size:18px}
.chip{display:inline-block;background:var(--sun);color:var(--sea);font-weight:700;padding:8px 12px;border-radius:20px;margin:4px;touch-action:none;cursor:grab;user-select:none}
ol li{font-weight:700;color:var(--leaf)}
.seg{display:flex;gap:8px;margin-bottom:8px}.seg button{flex:1;border:2px solid var(--sea);background:#fff;color:var(--sea);border-radius:12px;padding:8px;font:inherit;font-weight:700}.seg button.on{background:var(--sea);color:#fff}
.space{background:radial-gradient(circle at 20% 25%,#17306e,#050b24);border-radius:16px;padding:12px}
#cv{display:block;margin:0 auto;width:100%;max-width:400px;aspect-ratio:1;border-radius:50%;box-shadow:0 0 36px #4fc3ff88;touch-action:none}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.lc{border:2px solid;background:#fff;border-radius:16px;padding:4px 10px;font:inherit;font-size:13px;font-weight:700;color:var(--ink)}.lc.on{background:var(--sea);color:#fff}.inf{margin-top:8px;font-weight:600}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
</style></head><body>
<header><h1>🌍 భూగోళం • Learning with Doing</h1>

<script>
const $=s=>document.querySelector(s),M=$('main');let score=0,mute=false,AC,stop=()=>{};
function tone(f,d,ty,v,w){if(mute)return;AC=AC||new(window.AudioContext||webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(w||0);o.type=ty||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}
const ok=()=>[523,659,784].forEach((f,i)=>tone(f,.15,'triangle',.18,i*.08)),bad=()=>tone(160,.3,'sawtooth',.1),win=()=>[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.1));
const add=n=>{score+=n;$('#sc').textContent='⭐ '+score};
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);

const T=[['🌍','3D గ్లోబ్',spin],['❓','క్విజ్',()=>run(Q)],['✅','ఒప్పా? తప్పా?',()=>run(TF)],['🔗','జతపరచు',match],['🔢','వరుసలో పెట్టు',order],['🧲','లాగి పెట్టు',drag]];
$('nav').innerHTML=T.map((t,i)=>`<button data-i="${i}">${t[0]} ${t[1]}</button>`).join('');
function go(i){stop();stop=()=>{};document.querySelectorAll('nav button').forEach((b,j)=>b.classList.toggle('on',i==j));M.innerHTML='';T[i][2]()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
$('#mute').onclick=e=>{mute=!mute;e.target.textContent=mute?'🔇':'🔊'};

/* ---- Quiz + Statements (same engine) ---- */
const Q=[
["భూమి ఆకారం ఎలా ఉంటుంది?",["చదునైన పళ్ళెం","గోళం లాంటిది","చతురస్రం","త్రిభుజం"],1,"భూమి గోళం లాంటి ఆకారంలో ఉంటుంది."],
["0° అక్షాంశ రేఖ పేరేమిటి?",["కర్కాటక రేఖ","ప్రధాన రేఖాంశం","భూమధ్యరేఖ","ఆర్కిటిక్ వృత్తం"],2,"0° అక్షాంశ రేఖ భూమధ్యరేఖ."],
["భూమి తన అక్షం చుట్టూ ఒకసారి తిరగడానికి పట్టే సమయం?",["12 గంటలు","24 గంటలు","30 రోజులు","365 రోజులు"],1,"భ్రమణానికి 24 గంటలు పడుతుంది. అందుకే పగలు-రాత్రి."],
["భూమి సూర్యుని చుట్టూ ఒకసారి తిరగడానికి పట్టే సమయం?",["24 గంటలు","30 రోజులు","సుమారు 365¼ రోజులు","10 సంవత్సరాలు"],2,"ఇది పరిభ్రమణం. దీనివల్ల రుతువులు ఏర్పడతాయి."],
["0° రేఖాంశం (ప్రధాన రేఖాంశం) ఏ ప్రదేశం గుండా వెళ్తుంది?",["గ్రీన్‌విచ్","ఢిల్లీ","టోక్యో","కైరో"],0,"ప్రధాన రేఖాంశం లండన్ దగ్గర గ్రీన్‌విచ్ గుండా వెళ్తుంది."],
["భూమి అక్షం ఎంత కోణంలో వంగి ఉంటుంది?",["0°","23½°","45°","90°"],1,"భూమి అక్షం సుమారు 23½° వంగి ఉంటుంది."],

["A: అక్షాంశాలు సమాంతర వృత్తాలు.<br>B: రేఖాంశాలు సమాంతర వృత్తాలు.<br>ఏది సరైనది?",["A మాత్రమే","B మాత్రమే","A, B రెండూ","రెండూ కాదు"],0,"అక్షాంశాలు మాత్రమే సమాంతర వృత్తాలు. రేఖాంశాలు ధ్రువాల వద్ద కలుస్తాయి."]];

["భూమి తూర్పు నుండి పడమరకు తిరుగుతుంది.",YN,1,"భూమి పడమర నుండి తూర్పుకు తిరుగుతుంది."],
["ఉత్తర ధ్రువం 90° ఉత్తర అక్షాంశం వద్ద ఉంటుంది.",YN,0,"సరైనది."],
["భూమిపై నీటికంటే భూభాగమే ఎక్కువ.",YN,1,"నీరే ఎక్కువ (సుమారు 71%)."]];
function run(L){let i=0,c=0;(function show(){
if(i>=L.length){win();M.innerHTML=`<div class="card"><h2>🎉 ${c} / ${L.length}</h2><p>చాలా బాగా చేశావు!</p><button class="go" id="r">మళ్ళీ ఆడు</button></div>`;$('#r').onclick=()=>run(L);return}
const q=L[i];M.innerHTML=`<div class="card"><small>ప్రశ్న ${i+1} / ${L.length}</small><h2>${q[0]}</h2>${q[1].map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}<div class="msg"></div></div>`;
const bs=M.querySelectorAll('.opt');bs.forEach(b=>b.onclick=()=>{const good=+b.dataset.k==q[2];bs.forEach(x=>x.disabled=true);b.classList.add(good?'good':'bad');if(!good)bs[q[2]].classList.add('good');if(good){ok();add(10);c++}else bad();
$('.msg').innerHTML=q[3]+'<br><button class="go">తరువాత ▶</button>';$('.go').onclick=()=>{i++;show()}})})()}

/* ---- Match ---- */
function match(){const P=[["భూమధ్యరేఖ","0° అక్షాంశం"],["ప్రధాన రేఖాంశం","0° రేఖాంశం"],["కర్కాటక రేఖ","23½° ఉత్తరం"],["మకర రేఖ","23½° దక్షిణం"],["ఆర్కిటిక్ వృత్తం","66½° ఉత్తరం"],["ఉత్తర ధ్రువం","90° ఉత్తరం"]];let a=null,d=0;
M.innerHTML=`<div class="card"><h2>జతపరచండి</h2><p>ఎడమవైపు ఒకటి, కుడివైపు దాని జవాబు నొక్కండి.</p><div class="two"><div>${P.map((p,i)=>`<button class="opt" data-s="L" data-i="${i}">${p[0]}</button>`).join('')}</div><div>${sh(P.map((p,i)=>[p[1],i])).map(r=>`<button class="opt" data-s="R" data-i="${r[1]}">${r[0]}</button>`).join('')}</div></div><div class="msg"></div></div>`;
M.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(b.classList.contains('good'))return;
if(b.dataset.s=='L'){M.querySelectorAll('[data-s=L]').forEach(x=>x.classList.remove('sel'));a=b;b.classList.add('sel');return}

if(a.dataset.i==b.dataset.i){a.classList.remove('sel');a.classList.add('good');b.classList.add('good');a=null;ok();add(10);if(++d==P.length){win();$('.msg').textContent='🎉 అన్నీ సరిగ్గా జతపరిచావు!'}}else{bad();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),500)}})}

/* ---- Order ---- */
function order(){const O=["ఉత్తర ధ్రువం","ఆర్కిటిక్ వృత్తం","కర్కాటక రేఖ","భూమధ్యరేఖ","మకర రేఖ","దక్షిణ ధ్రువం"];let n=0;

/* ---- Drag labels onto the globe diagram ---- */
function drag(){const L=[["ఆర్కిటిక్ వృత్తం",66.5],["కర్కాటక రేఖ",23.5],["భూమధ్యరేఖ",0],["మకర రేఖ",-23.5],["అంటార్కిటిక్ వృత్తం",-66.5]],r=Math.PI/180;let d=0;

M.querySelectorAll('.chip').forEach(c=>{let ox,oy,sx,sy;

else{c.removeAttribute('style');if(Math.hypot(e.clientX-sx,e.clientY-sy)>8)bad()}}})}
